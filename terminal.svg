<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal window loading developer profile status: AI/ML, Software Development, Computer Vision, Cybersecurity, 3D Web all OK, system ready">
  <defs>
    <style>
      .t{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;fill:#C9D1D9}
      .g{fill:#58A6FF}
      .dim{fill:#6E7681}
      .line{opacity:0;animation:none}
    </style>
  </defs>

  <rect width="700" height="260" rx="10" fill="#0D1117"/>
  <rect width="700" height="260" rx="10" fill="none" stroke="#30363D"/>

  <!-- title bar -->
  <rect width="700" height="34" rx="10" fill="#161B22"/>
  <rect y="24" width="700" height="10" fill="#161B22"/>
  <circle cx="24" cy="17" r="5" fill="#30363D"/>
  <circle cx="44" cy="17" r="5" fill="#30363D"/>
  <circle cx="64" cy="17" r="5" fill="#30363D"/>
  <text x="330" y="21" class="t dim" font-size="11">profile.sh</text>

  <text x="22" y="66" class="t"><tspan class="g">je-r@github</tspan>:~$ whoami</text>

  <g>
    <text x="22" y="94" class="t" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.1;1" dur="8s" repeatCount="indefinite"/>
      je-r-o-casinginan
    </text>
    <text x="22" y="122" class="t" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.2;1" dur="8s" repeatCount="indefinite"/>
      <tspan class="g">je-r@github</tspan>:~$ ./profile
    </text>
    <text x="22" y="150" class="t dim" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.3;1" dur="8s" repeatCount="indefinite"/>
      &gt; loading developer profile...
    </text>
    <text x="22" y="172" class="t" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.4;1" dur="8s" repeatCount="indefinite"/>
      [<tspan class="g">OK</tspan>] AI / ML
    </text>
    <text x="22" y="192" class="t" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.5;1" dur="8s" repeatCount="indefinite"/>
      [<tspan class="g">OK</tspan>] Software Development
    </text>
    <text x="22" y="212" class="t" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="8s" repeatCount="indefinite"/>
      [<tspan class="g">OK</tspan>] Computer Vision
    </text>
    <text x="22" y="232" class="t" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.67;1" dur="8s" repeatCount="indefinite"/>
      [<tspan class="g">OK</tspan>] Cybersecurity &amp; 3D Web
    </text>
    <text x="22" y="252" class="t dim" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.8;1" dur="8s" repeatCount="indefinite"/>
      &gt; system ready.
    </text>
  </g>
</svg>
