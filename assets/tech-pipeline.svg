<svg width="1000" height="140" viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pipeline diagram: Python to Data to Model to API to Interface to Deployment">
  <defs>
    <style>
      .node{font-family:'JetBrains Mono',Consolas,monospace;font-size:13px;fill:#E6EDF3;letter-spacing:1px}
      .lbl{font-family:'JetBrains Mono',Consolas,monospace;font-size:10px;fill:#6E7681;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1000" height="140" rx="10" fill="#0D1117"/>
  <rect width="1000" height="140" rx="10" fill="none" stroke="#30363D"/>
  <text x="30" y="28" class="lbl">TECH_PIPELINE</text>

  <!-- connecting line -->
  <line x1="60" y1="80" x2="940" y2="80" stroke="#30363D" stroke-width="2"/>
  <line x1="60" y1="80" x2="940" y2="80" stroke="#58A6FF" stroke-width="2" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-480" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g>
    <circle cx="90" cy="80" r="5" fill="#58A6FF"/>
    <text x="65" y="60" class="node">PYTHON</text>

    <circle cx="270" cy="80" r="5" fill="#58A6FF"/>
    <text x="252" y="60" class="node">DATA</text>

    <circle cx="450" cy="80" r="5" fill="#58A6FF"/>
    <text x="424" y="60" class="node">MODEL</text>

    <circle cx="610" cy="80" r="5" fill="#58A6FF"/>
    <text x="592" y="60" class="node">API</text>

    <circle cx="780" cy="80" r="5" fill="#58A6FF"/>
    <text x="740" y="60" class="node">INTERFACE</text>

    <circle cx="930" cy="80" r="5" fill="#58A6FF"/>
    <text x="862" y="112" class="node">DEPLOYMENT</text>
  </g>
</svg>
