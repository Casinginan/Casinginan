<svg width="1000" height="70" viewBox="0 0 1000 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build, break, learn, build again. Je-R O. Casinginan">
  <rect width="1000" height="70" fill="#0D1117"/>
  <line x1="0" y1="8" x2="1000" y2="8" stroke="#30363D" stroke-width="1"/>
  <line x1="0" y1="8" x2="120" y2="8" stroke="#58A6FF" stroke-width="1">
    <animate attributeName="x1" values="0;880;0" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="120;1000;120" dur="5s" repeatCount="indefinite"/>
  </line>
  <text x="500" y="40" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8B949E" letter-spacing="2">BUILD &#8594; BREAK &#8594; LEARN &#8594; BUILD AGAIN</text>
  <text x="500" y="58" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="10" fill="#6E7681" letter-spacing="1">&#169; JE-R O. CASINGINAN</text>
</svg>
