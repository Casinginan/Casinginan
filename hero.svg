<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JE-R O. CASINGINAN — BSIT Student, Developer, Builder. Focus: AI/ML, Software, Computer Vision, Cybersecurity, 3D Web.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="10" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="10" fill="url(#grid)"/>
  <rect width="1000" height="260" rx="10" fill="none" stroke="#30363D" stroke-width="1"/>

  <!-- scanning line -->
  <rect x="0" y="-40" width="1000" height="40" fill="url(#scan)">
    <animate attributeName="y" values="-40;260;-40" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- status tag -->
  <circle cx="46" cy="46" r="4" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="50" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8B949E" letter-spacing="2">SYSTEM ONLINE</text>

  <!-- name -->
  <text x="46" y="120" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#E6EDF3">JE-R O. CASINGINAN</text>

  <!-- role line with typing cursor -->
  <text x="48" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#58A6FF" letter-spacing="1">BSIT STUDENT&#160;&#8226;&#160;DEVELOPER&#160;&#8226;&#160;BUILDER</text>
  <rect x="330" y="139" width="9" height="16" fill="#58A6FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- focus tags -->
  <text x="48" y="185" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#8B949E" letter-spacing="1">AI/ML &#8226; SOFTWARE &#8226; COMPUTER VISION &#8226; CYBERSECURITY &#8226; 3D WEB</text>

  <!-- bottom divider -->
  <line x1="46" y1="212" x2="954" y2="212" stroke="#30363D" stroke-width="1"/>
  <text x="46" y="236" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#6E7681" letter-spacing="1">LEARN &#8594; BUILD &#8594; BREAK &#8594; UNDERSTAND &#8594; IMPROVE &#8594; REPEAT</text>
</svg>
